name: Build HomeNX.nro

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Get current week as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl gcc g++ zip zstd cmake

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo -u --root

      - name: Configure (homebrew .nro)
        run: xmake f --yes -p cross -m release -a aarch64 --toolchain=devkita64 --homebrew=y -vD --root

      - name: Build
        run: xmake build -vD --root SwitchU

      - name: Collect
        run: |
          mkdir -p out
          cp build/cross/aarch64/release/HomeNX.nro out/

      - uses: actions/upload-artifact@v4
        with:
          name: HomeNX
          path: out/HomeNX.nro

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (type gh >/dev/null 2>&1) || (apt-get -y install gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg && echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list && apt-get update && apt-get -y install gh))
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --title "HomeNX (latest build)" --notes "Built from master."
          gh release upload latest out/HomeNX.nro -R "$GITHUB_REPOSITORY" --clobber
