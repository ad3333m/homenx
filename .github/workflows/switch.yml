name: Build HomeNX

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  HOMENX_BUILD: ${{ github.run_number }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Get current week as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl gcc g++ zip unzip zstd cmake python3

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo -u --root

      - name: Bundle Sphaira (GPL-3, ITotalJustice/sphaira)
        run: |
          mkdir -p romfs/bin
          curl -fsSL -o /tmp/sphaira.zip https://github.com/ITotalJustice/sphaira/releases/download/1.0.8/sphaira.zip
          unzip -p /tmp/sphaira.zip switch/sphaira/sphaira.nro > romfs/bin/sphaira.nro
          test -s romfs/bin/sphaira.nro

      - name: Configure (homebrew .nro)
        run: xmake f --yes -p cross -m release -a aarch64 --toolchain=devkita64 --homebrew=y -vD --root

      - name: Build
        run: |
          xmake build -vD --root SwitchU
          xmake build -vD --root SwitchU-Manager

      - name: Collect
        run: |
          mkdir -p out
          cp build/cross/aarch64/release/HomeNX.nro out/
          cp build/cross/aarch64/release/HomeNX-Toggle.nro out/

      - uses: actions/upload-artifact@v4
        with:
          name: HomeNX
          path: out/*.nro

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (type gh >/dev/null 2>&1) || (apt-get -y install gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg && echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list && apt-get update && apt-get -y install gh))
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create latest -R "$GITHUB_REPOSITORY" --title "HomeNX (latest build)" --notes "Built from master." || true
          gh release upload latest out/* -R "$GITHUB_REPOSITORY" --clobber

  frontend:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Get current week as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl gcc g++ zip unzip zstd cmake python3

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo -u --root

      - name: Bundle Sphaira (GPL-3, ITotalJustice/sphaira)
        run: |
          mkdir -p romfs/bin
          curl -fsSL -o /tmp/sphaira.zip https://github.com/ITotalJustice/sphaira/releases/download/1.0.8/sphaira.zip
          unzip -p /tmp/sphaira.zip switch/sphaira/sphaira.nro > romfs/bin/sphaira.nro
          test -s romfs/bin/sphaira.nro

      - name: Configure frontend (replaces the HOME menu)
        run: xmake f --yes -p cross -m release -a aarch64 --toolchain=devkita64 -vD --root

      - name: Build
        run: |
          # The Loader is compiled into the menu, so build it first and embed it.
          xmake build -vD --root HomeNX-Loader
          mkdir -p projects/menu/src/generated
          python3 tools/embed_loader.py build/cross/aarch64/release/HomeNX-Loader.nro projects/menu/src/generated/loader_nro.inc
          xmake build -vD --root

      - name: Package install layout
        run: |
          xmake install -o dist/frontend --root
          test -d dist/frontend/atmosphere
          test -d dist/frontend/switch
          # The Loader lives in HomeNX's own folder so every updater installs it.
          mkdir -p dist/frontend/switch/SwitchU/bin
          cp build/cross/aarch64/release/HomeNX-Loader.nro dist/frontend/switch/SwitchU/bin/homenx-loader.nro
          cp romfs/bin/sphaira.nro dist/frontend/switch/SwitchU/bin/sphaira.nro
          # The Toggle ships inside HomeNX's folder and the menu copies it into
          # switch/HomeNX-Toggle/ (a running Toggle can't replace its own .nro).
          mv dist/frontend/switch/HomeNX-Toggle/HomeNX-Toggle.nro dist/frontend/switch/SwitchU/bin/homenx-toggle.nro
          rm -rf dist/frontend/switch/HomeNX-Toggle dist/frontend/switch/HomeNX-Loader
          # HomeNX Toggle reads this to know which frontend build is installed.
          echo "build $HOMENX_BUILD" > dist/frontend/switch/SwitchU/homenx-build.txt
          mkdir -p out
          cd dist/frontend && zip -r "$GITHUB_WORKSPACE/out/HomeNX-frontend.zip" atmosphere switch

      - uses: actions/upload-artifact@v4
        with:
          name: HomeNX-frontend
          path: out/HomeNX-frontend.zip

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (type gh >/dev/null 2>&1) || (apt-get -y install gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg && echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list && apt-get update && apt-get -y install gh))
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create latest -R "$GITHUB_REPOSITORY" --title "HomeNX (latest build)" --notes "Built from master." || true
          # Never leave the release without a complete zip (a download during an
          # in-place --clobber gets cut off): upload under a temporary name, then
          # swap it in with a rename.
          R="$GITHUB_REPOSITORY"
          cp out/HomeNX-frontend.zip out/HomeNX-frontend-next.zip
          gh release upload latest out/HomeNX-frontend-next.zip -R "$R" --clobber
          asset_id() { gh api "repos/$R/releases/tags/latest" -q ".assets[] | select(.name==\"$1\") | .id"; }
          OLD=$(asset_id HomeNX-frontend.zip)
          NEXT=$(asset_id HomeNX-frontend-next.zip)
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/$R/releases/assets/$OLD"; fi
          gh api -X PATCH "repos/$R/releases/assets/$NEXT" -f name=HomeNX-frontend.zip >/dev/null
          # Title last: HomeNX Toggle treats "HomeNX build N" as "zip N is ready".
          gh release edit latest -R "$GITHUB_REPOSITORY" --title "HomeNX build $HOMENX_BUILD"
