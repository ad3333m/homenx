name: Build HomeNX

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  HOMENX_BUILD: ${{ github.run_number }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Get current week as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl gcc g++ zip unzip zstd cmake python3

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo -u --root

      - name: Bundle Sphaira (GPL-3, ITotalJustice/sphaira)
        run: |
          mkdir -p romfs/bin
          curl -fsSL -o /tmp/sphaira.zip https://github.com/ITotalJustice/sphaira/releases/download/1.0.8/sphaira.zip
          unzip -p /tmp/sphaira.zip switch/sphaira/sphaira.nro > romfs/bin/sphaira.nro
          test -s romfs/bin/sphaira.nro

      - name: Configure (homebrew .nro)
        run: xmake f --yes -p cross -m release -a aarch64 --toolchain=devkita64 --homebrew=y -vD --root

      - name: GameTDB box-art index for CardsNX
        run: |
          mkdir -p build/cards-romfs
          python3 tools/make_gametdb_index.py build/cards-romfs/gametdb.tsv || echo "GameTDB index skipped"

      - name: Build
        run: |
          xmake build -vD --root SwitchU
          xmake build -vD --root SwitchU-Manager
          xmake build -vD --root CardsNX

      - name: Collect
        run: |
          mkdir -p out
          cp build/cross/aarch64/release/HomeNX.nro out/
          cp build/cross/aarch64/release/NXToggle.nro out/
          cp build/cross/aarch64/release/CardsNX.nro out/

      - uses: actions/upload-artifact@v4
        with:
          name: HomeNX
          path: out/*.nro

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (type gh >/dev/null 2>&1) || (apt-get -y install gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg && echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list && apt-get update && apt-get -y install gh))
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create latest -R "$GITHUB_REPOSITORY" --title "HomeNX (latest build)" --notes "Built from master." || true
          gh release upload latest out/HomeNX.nro out/NXToggle.nro -R "$GITHUB_REPOSITORY" --clobber
          # CardsNX: its own release, the .nro replaced on every build.
          gh release view cardsnx -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create cardsnx -R "$GITHUB_REPOSITORY" --title "CardsNX" --latest=false --notes-file .github/cardsnx-release.md || true
          gh release edit cardsnx -R "$GITHUB_REPOSITORY" --title "CardsNX (build $HOMENX_BUILD)" --notes-file .github/cardsnx-release.md || true
          gh release upload cardsnx out/CardsNX.nro -R "$GITHUB_REPOSITORY" --clobber

  frontend:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Get current week as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl gcc g++ zip unzip zstd cmake python3

      - name: Build the Discord overlay (Tesla/Ultrahand .ovl)
        run: |
          dkp-pacman -S --needed --noconfirm switch-curl switch-zlib switch-mbedtls || true
          make -C projects/overlay -j"$(nproc)"
          test -s projects/overlay/homenx-discord.ovl

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo -u --root

      - name: Bundle Sphaira (GPL-3, ITotalJustice/sphaira)
        run: |
          mkdir -p romfs/bin
          curl -fsSL -o /tmp/sphaira.zip https://github.com/ITotalJustice/sphaira/releases/download/1.0.8/sphaira.zip
          unzip -p /tmp/sphaira.zip switch/sphaira/sphaira.nro > romfs/bin/sphaira.nro
          test -s romfs/bin/sphaira.nro

      - name: Configure frontend (replaces the HOME menu)
        run: xmake f --yes -p cross -m release -a aarch64 --toolchain=devkita64 -vD --root

      - name: GameTDB box-art index for CardsNX
        run: |
          mkdir -p build/cards-romfs
          python3 tools/make_gametdb_index.py build/cards-romfs/gametdb.tsv || echo "GameTDB index skipped"

      - name: Build
        run: |
          # The Loader is compiled into the menu, so build it first and embed it.
          xmake build -vD --root HomeNX-Loader
          mkdir -p projects/menu/src/generated
          python3 tools/embed_loader.py build/cross/aarch64/release/HomeNX-Loader.nro projects/menu/src/generated/loader_nro.inc
          xmake build -vD --root

      - name: Package install layout
        run: |
          xmake install -o dist/frontend --root
          test -d dist/frontend/atmosphere
          test -d dist/frontend/switch
          # The Loader lives in HomeNX's own folder so every updater installs it.
          mkdir -p dist/frontend/switch/SwitchU/bin
          cp build/cross/aarch64/release/HomeNX-Loader.nro dist/frontend/switch/SwitchU/bin/homenx-loader.nro
          cp romfs/bin/sphaira.nro dist/frontend/switch/SwitchU/bin/sphaira.nro
          # The menu copies it to switch/.overlays/ (the updaters only write HomeNX's folders).
          cp projects/overlay/homenx-discord.ovl dist/frontend/switch/SwitchU/bin/homenx-discord.ovl
          # NXToggle ships inside HomeNX's folder and the menu copies it into
          # switch/NXToggle/ (a running Toggle can't replace its own .nro).
          mv dist/frontend/switch/NXToggle/NXToggle.nro dist/frontend/switch/SwitchU/bin/homenx-toggle.nro
          # The Homebrew Manager too: the menu copies it into switch/Homebrew-Manager/.
          mv "dist/frontend/switch/Homebrew Manager/Homebrew Manager.nro" dist/frontend/switch/SwitchU/bin/homebrew-manager.nro
          # CardsNX (the card-row HOME screen) too: switch/CardsNX/.
          mv dist/frontend/switch/CardsNX/CardsNX.nro dist/frontend/switch/SwitchU/bin/cardsnx.nro
          rm -rf dist/frontend/switch/NXToggle dist/frontend/switch/HomeNX-Loader "dist/frontend/switch/Homebrew Manager" dist/frontend/switch/CardsNX
          # CardsNX as HOME (NXToggle > Home screen): its fonts, icons, certificate
          # and GameTDB index, where the menu looks for them.
          mkdir -p dist/frontend/switch/SwitchU/cards
          cp -r build/cards-romfs/. dist/frontend/switch/SwitchU/cards/
          # HomeNX Toggle reads this to know which frontend build is installed.
          echo "build $HOMENX_BUILD" > dist/frontend/switch/SwitchU/homenx-build.txt
          mkdir -p out
          # HomeNX-full.zip: everything, for a fresh install. HomeNX-frontend.zip is
          # what the on-console updaters download: the same minus the parts that
          # never change between builds (menu music, eSpeak voices, the pinned
          # Sphaira), 13 MB instead of 50 MB. An existing install keeps those.
          cd dist/frontend && zip -r "$GITHUB_WORKSPACE/out/HomeNX-full.zip" atmosphere switch
          zip -r "$GITHUB_WORKSPACE/out/HomeNX-frontend.zip" atmosphere switch             -x 'switch/SwitchU/sounds/*' 'switch/SwitchU/espeak-ng-data/*' 'switch/SwitchU/bin/sphaira.nro'

      - uses: actions/upload-artifact@v4
        with:
          name: HomeNX-frontend
          path: |
            out/HomeNX-frontend.zip
            out/HomeNX-full.zip

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (type gh >/dev/null 2>&1) || (apt-get -y install gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg && echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list && apt-get update && apt-get -y install gh))
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create latest -R "$GITHUB_REPOSITORY" --title "HomeNX (latest build)" --notes "Built from master." || true
          # Never leave the release without a complete zip (a download during an
          # in-place --clobber gets cut off): upload under a temporary name, then
          # swap it in with a rename.
          R="$GITHUB_REPOSITORY"
          cp out/HomeNX-frontend.zip out/HomeNX-frontend-next.zip
          gh release upload latest out/HomeNX-frontend-next.zip -R "$R" --clobber
          asset_id() { gh api "repos/$R/releases/tags/latest" -q ".assets[] | select(.name==\"$1\") | .id"; }
          OLD=$(asset_id HomeNX-frontend.zip)
          NEXT=$(asset_id HomeNX-frontend-next.zip)
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/$R/releases/assets/$OLD"; fi
          gh api -X PATCH "repos/$R/releases/assets/$NEXT" -f name=HomeNX-frontend.zip >/dev/null
          gh release upload latest out/HomeNX-full.zip -R "$R" --clobber
          # Title last: HomeNX Toggle treats "HomeNX build N" as "zip N is ready".
          gh release edit latest -R "$GITHUB_REPOSITORY" --title "HomeNX build $HOMENX_BUILD"
